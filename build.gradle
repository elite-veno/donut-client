plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        'donut' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // GoNuts ships inside the Donut Client jar as a nested mod.
    include(implementation("dev.doughbay:trader-fabric:0.1.0+26.2"))
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

sourceSets.test {
    compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
    runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
}

test { useJUnitPlatform() }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'donut-gametest'
        enableGameTests = false
        enableClientGameTests = true
        // DebrisSeedGameTest runs a dedicated server, which needs the Minecraft EULA accepted.
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

// Minecraft 26.2 runs on Java 25.
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
    // GoNuts ships inside this jar, and its MIT license asks for its notice to come with every copy.
    from('../Gonuts/LICENSE') { rename { 'LICENSE_doughbay' } }
}
