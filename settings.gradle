pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'donut-client'
// GoNuts, built from its own clone (branch local-hardening) next to this one: dev.doughbay:trader-fabric resolves to
// that project. -PgonutsDir=<path> points elsewhere, as for a worktree that isn't beside the Gonuts clone.
includeBuild(providers.gradleProperty('gonutsDir').getOrElse('../Gonuts'))
